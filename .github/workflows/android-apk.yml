name: Build Android APK

# Spustí se ručně z GitHubu (Actions → Build Android APK → Run workflow)
# Nové číslo verze spustí sestavení automaticky po uložení na main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android-release.json
      - scripts/android-version.mjs
      - .github/workflows/android-apk.yml
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch Bluetooth serial plugin
        run: node scripts/patch-bluetooth-serial.mjs

      - name: Test Android version configuration
        run: node --test scripts/android-version.test.mjs

      - name: Prepare webDir (dist/)
        run: |
          # Capacitor používá server.url (načítá web z https://vino-ride-connect.lovable.app),
          # ale i tak potřebuje, aby webDir 'dist' existoval pro `cap sync`.
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!doctype html><html><body>Vinné Taxi</body></html>' > dist/index.html
          fi

      - name: Add Android platform
        run: |
          # Zachovej google-services.json a obnov ho po cap add (cap add vyžaduje, aby android/ neexistovalo)
          if [ -f android/app/google-services.json ]; then
            mkdir -p /tmp/gs-backup
            cp android/app/google-services.json /tmp/gs-backup/google-services.json
          fi
          rm -rf android
          bunx cap add android
          if [ -f /tmp/gs-backup/google-services.json ]; then
            cp /tmp/gs-backup/google-services.json android/app/google-services.json
          fi
          bunx cap sync android

      - name: Set Android release version
        run: |
          node scripts/android-version.mjs
          echo "APK_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('android-release.json', 'utf8')).versionName")" >> "$GITHUB_ENV"

      - name: Generate app icon + splash from resources/
        run: |
          bun add -d @capacitor/assets || true
          bunx @capacitor/assets generate --android || echo "icon generation skipped"

      - name: Inject Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.WAKE_LOCK" />'
          # Vloží oprávnění hned za <manifest ...>
          if ! grep -q "ACCESS_BACKGROUND_LOCATION" "$MANIFEST"; then
            awk -v perms="$PERMS" '/<manifest /{print; print perms; next}1' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          fi
          cat "$MANIFEST"

          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            awk '/<manifest /{print; print "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />"; next}1' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          fi

      - name: Apply Google Services (Firebase) Gradle plugin
        run: |
          # Přidá classpath pro google-services plugin do project-level build.gradle
          PROJ_GRADLE=android/build.gradle
          if ! grep -q "com.google.gms:google-services" "$PROJ_GRADLE"; then
            # Vloží classpath do dependencies bloku buildscriptu
            awk '
              /dependencies \{/ && !x {
                print;
                print "        classpath '\''com.google.gms:google-services:4.4.2'\''";
                x=1; next
              }
              { print }
            ' "$PROJ_GRADLE" > "$PROJ_GRADLE.tmp" && mv "$PROJ_GRADLE.tmp" "$PROJ_GRADLE"
          fi
          cat "$PROJ_GRADLE"

          # Aplikuje plugin v app-level build.gradle
          APP_GRADLE=android/app/build.gradle
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo "" >> "$APP_GRADLE"
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
          fi
          tail -20 "$APP_GRADLE"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon


      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vinne-taxi.apk

      - name: Verify APK version and permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging vinne-taxi.apk > /tmp/apk-badging.txt
          grep -F "name='app.lovable.vinnetaxi'" /tmp/apk-badging.txt
          grep -F "versionName='$APK_VERSION'" /tmp/apk-badging.txt
          VERSION_CODE=$(node -p "JSON.parse(require('fs').readFileSync('android-release.json', 'utf8')).versionCode")
          grep -F "versionCode='$VERSION_CODE'" /tmp/apk-badging.txt
          for permission in RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION POST_NOTIFICATIONS BLUETOOTH_CONNECT; do
            grep -F "android.permission.$permission'" /tmp/apk-badging.txt
          done
          echo "### Vinné Taxi $APK_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo 'Stáhněte níže artefakt APK, rozbalte ZIP a otevřete vinne-taxi.apk v telefonu.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Při konfliktu podpisu je potřeba odinstalovat starou APK; poté se znovu přihlaste.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: vinne-taxi-apk-${{ env.APK_VERSION }}
          path: vinne-taxi.apk
          retention-days: 30

      - name: Create GitHub Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vinne-taxi.apk
          generate_release_notes: true
